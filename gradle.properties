# WSL has about 3.5 GB in total, and a 3g daemon plus the Kotlin daemon triggered the kernel OOM killer.
# Keep the daemons small and run tasks sequentially.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
